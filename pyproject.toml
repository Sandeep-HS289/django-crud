[project]
name = "h02"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sandeep", email = "infernoalways.9@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "django==5.2.6",
    "gunicorn>=26.2.0",
    "langchain>=1.3.17",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.3",
    "whitenoise>=6.12.0",
]

[project.scripts]
h02 = "h02:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
extraPaths = ["."]

[dependency-groups]
dev = [
    "django-stubs>=6.1.1",
]

